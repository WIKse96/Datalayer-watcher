<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataLayer Watcher</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title-row">
        <span class="logo">▦</span>
        <h1>DataLayer Watcher</h1>
      </div>
      <div class="meta-row">
        <span id="domain" class="domain" title="Domena aktywnej karty">—</span>
        <span id="count" class="count">0 eventów</span>
      </div>
    </header>

    <div class="toolbar">
      <input
        id="filter"
        type="search"
        class="filter"
        placeholder="Filtr po nazwie eventu (np. add_to_cart)"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="clear" class="btn btn-clear" title="Wyczyść historię tej karty">
        Clear
      </button>
    </div>

    <div class="toolbar toolbar-actions">
      <label class="selectall" title="Zaznacz/odznacz wszystkie widoczne">
        <input id="selectAll" type="checkbox" />
        <span>Zaznacz</span>
      </label>
      <span id="selCount" class="sel-count"></span>
      <button id="export" class="btn btn-export" title="Eksportuj do pliku JSON">
        Export JSON
      </button>
    </div>

    <div class="options">
      <label class="switch">
        <input id="onlyEcom" type="checkbox" />
        <span>Pokaż tylko ecommerce GA4 (schowaj eventy niestandardowe: cookie_consent, ajaxComplete itp.)</span>
      </label>
      <label class="switch">
        <input id="dedup" type="checkbox" />
        <span>Pokaż tylko unikalne (zwiń powtórzenia o identycznej treści)</span>
      </label>
      <label class="switch">
        <input id="hideTech" type="checkbox" />
        <span>Ukryj eventy techniczne (bez klucza <code>event</code>)</span>
      </label>
      <label class="switch">
        <input id="hideGtm" type="checkbox" />
        <span>Ukryj eventy GTM (<code>gtm.js</code>, <code>gtm.dom</code>, <code>gtm.load</code>, <code>gtm.click</code>…)</span>
      </label>
      <label class="switch">
        <input id="keepDomain" type="checkbox" />
        <span>Zachowaj historię między nawigacjami w obrębie tej samej domeny</span>
      </label>
    </div>

    <div class="legend">
      <span class="chip chip-ecom">ecommerce GA4</span>
      <span class="chip chip-gtm">GTM / standard</span>
    </div>

    <main id="list" class="list" aria-live="polite">
      <div id="empty" class="empty">
        Brak przechwyconych eventów dla tej karty.<br />
        Odśwież stronę z GTM/dataLayer, aby zacząć nasłuch.
      </div>
    </main>

    <template id="event-tpl">
      <article class="event">
        <div class="event-head">
          <input class="event-select" type="checkbox" title="Zaznacz do eksportu" />
          <button class="event-toggle" type="button">
            <span class="caret">▶</span>
            <span class="event-name"></span>
            <span class="dup-badge" hidden></span>
          </button>
          <div class="event-actions">
            <span class="event-time"></span>
            <button class="btn btn-copy" type="button" title="Kopiuj JSON">copy</button>
          </div>
        </div>
        <pre class="event-json" hidden><code></code></pre>
      </article>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
